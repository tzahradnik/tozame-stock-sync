name: Generate Shoptet stock XML (mijeurope feed)

on:
  schedule:
    # kazdy den v 5:30 UTC (7:30 CEST) - uprav podle toho, kdy si soubor stahujes
    - cron: "30 5 * * *"
    # druhy beh pred dennim syncem skladu ve 14:00 (sklad HobbyChef se meni casteji)
    - cron: "30 11 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install openpyxl

      - name: Generate stock_import.xml
        env:
          MIJEUROPE_FEED_URL: ${{ secrets.MIJEUROPE_FEED_URL }}
          OUT_DIR: public
        run: |
          mkdir -p public
          python convert_feed_xml.py

      - name: Generate stock_import_hobbychef.xml (Yaxell, Hasegawa, Naniwa)
        continue-on-error: true
        env:
          HOBBYCHEF_STOCK_URL: ${{ secrets.HOBBYCHEF_STOCK_URL }}
          OUT_DIR: public
        run: python convert_hobbychef.py

      - name: Detect new products in feeds
        id: detect
        continue-on-error: true
        env:
          OUT_DIR: public
          NEW_PRODUCTS_MD: new_products.md
        run: python detect_new_products.py

      - name: Notify about new products (GitHub issue)
        id: notify
        if: steps.detect.outcome == 'success' && hashFiles('new_products.md') != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create --title "Nové produkty ve feedech ($(date +%d.%m.%Y))" \
            --body-file new_products.md

      - name: Save known products state
        if: steps.detect.outcome == 'success' && steps.notify.outcome != 'failure'
        continue-on-error: true
        run: |
          if [ -n "$(git status --porcelain known_unmatched.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add known_unmatched.json
            git commit -m "Update known unmatched feed products"
            git pull --rebase -q origin main && git push -q origin HEAD:main
          fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
