name: Generate Shoptet stock XML (mijeurope feed)

on:
  schedule:
    # kazdy den v 5:30 UTC (7:30 CEST) - uprav podle toho, kdy si soubor stahujes
    - cron: "30 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install openpyxl

      - name: Generate stock_import.xml
        env:
          MIJEUROPE_FEED_URL: ${{ secrets.MIJEUROPE_FEED_URL }}
          OUT_DIR: public
        run: |
          mkdir -p public
          python convert_feed_xml.py

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
